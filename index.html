<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WoVP Integrity - Dépôt de Logs</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-hover: #334155;
      --primary: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #22c55e;
      --error: #ef4444;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    h1 {
      color: var(--primary);
      margin-bottom: 8px;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .search-box {
      margin-bottom: 25px;
      display: flex;
      justify-content: center;
    }

    .search-box input {
      width: 100%;
      max-width: 400px;
      padding: 12px 18px;
      border-radius: 8px;
      border: 1px solid #475569;
      background-color: var(--card-bg);
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }

    .search-box input:focus {
      border-color: var(--primary);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
    }

    .player-card {
      background-color: var(--card-bg);
      border: 2px dashed #475569;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      transition: all 0.2s ease;
      position: relative;
    }

    .player-card.dragover {
      border-color: var(--primary);
      background-color: var(--card-hover);
    }

    .player-name {
      font-weight: bold;
      font-size: 1.1rem;
      margin-bottom: 12px;
      color: var(--text);
    }

    .drop-zone-text {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .btn-browse {
      background-color: #334155;
      color: var(--primary);
      border: 1px solid var(--primary);
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: background 0.2s;
    }

    .btn-browse:hover {
      background-color: var(--primary);
      color: #0f172a;
    }

    .status-msg {
      margin-top: 10px;
      font-size: 0.85rem;
      font-weight: bold;
      min-height: 1.2em;
    }

    .status-msg.sending { color: var(--primary); }
    .status-msg.success { color: var(--success); }
    .status-msg.error { color: var(--error); }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>WoVP Integrity — Dépôt de Log</h1>
      <p class="subtitle">Sélectionnez votre nom, puis glissez votre fichier log ou parcourez vos fichiers.</p>
    </header>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Rechercher votre nom de joueur..." onkeyup="filterPlayers()">
    </div>

    <div class="grid" id="playersGrid"></div>
  </div>

  <script>
    // ⚠️ REMPLACER CETTE URL PAR L'URL DE VOTRE APPLICATION WEB GOOGLE APPS SCRIPT
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzICfzcQIGIL04nPUofXif_OIxpSbU2Epj28BG-Cgevuw3mEZ-Hv3JSYNAzj17MU3jU/exec";

    // LISTE DES JOUEURS (À adapter avec vos ~110 joueurs)
    const PLAYERS = [
      "Joueur_1", "Joueur_2", "Joueur_3", "Joueur_4",
      "Joueur_5", "Joueur_6", "Joueur_7", "Joueur_8",
      // Remplacez par vos vrais pseudo de joueurs
    ];

    const grid = document.getElementById('playersGrid');

    function renderPlayers(playerList) {
      grid.innerHTML = "";
      playerList.forEach(playerName => {
        const card = document.createElement('div');
        card.className = 'player-card';
        card.id = `card-${playerName}`;

        // Gestion du Drag & Drop
        card.ondragover = (e) => { e.preventDefault(); card.classList.add('dragover'); };
        card.ondragleave = () => card.classList.remove('dragover');
        card.ondrop = (e) => {
          e.preventDefault();
          card.classList.remove('dragover');
          if (e.dataTransfer.files.length > 0) {
            uploadLog(playerName, e.dataTransfer.files[0]);
          }
        };

        const safeId = playerName.replace(/[^a-zA-Z0-9]/g, '_');

        card.innerHTML = `
          <div class="player-name">${playerName}</div>
          <div class="drop-zone-text">Glissez votre .txt / .log ici<br>ou</div>
          <input type="file" id="file-${safeId}" style="display:none" onchange="uploadLog('${playerName}', this.files[0])">
          <button class="btn-browse" onclick="document.getElementById('file-${safeId}').click()">Parcourir</button>
          <div class="status-msg" id="status-${safeId}"></div>
        `;

        grid.appendChild(card);
      });
    }

    function filterPlayers() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = PLAYERS.filter(p => p.toLowerCase().includes(query));
      renderPlayers(filtered);
    }

    function uploadLog(playerName, file) {
      if (!file) return;

      const safeId = playerName.replace(/[^a-zA-Z0-9]/g, '_');
      const statusEl = document.getElementById(`status-${safeId}`);

      statusEl.className = "status-msg sending";
      statusEl.innerText = "Envoi en cours...";

      const reader = new FileReader();
      reader.onload = function(e) {
        const base64Data = e.target.result.split(',')[1] || e.target.result;

        const payload = {
          playerName: playerName,
          fileName: file.name,
          fileData: base64Data
        };

        fetch(GOOGLE_SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(data => {
          if (data.status === "success") {
            statusEl.className = "status-msg success";
            statusEl.innerText = "✅ Log envoyé !";
          } else {
            statusEl.className = "status-msg error";
            statusEl.innerText = "❌ Erreur envoi.";
          }
        })
        .catch(err => {
          console.error(err);
          statusEl.className = "status-msg error";
          statusEl.innerText = "❌ Erreur réseau.";
        });
      };

      reader.readAsDataURL(file);
    }

    // Initialisation
    renderPlayers(PLAYERS);
  </script>
</body>
</html>
